<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Inventario"/>
<title>Control de Stock</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:#0f0f13;color:#f0ede8;font-family:'Courier New',monospace;min-height:100vh}
input,select,button{font-family:'Courier New',monospace;outline:none}
input::placeholder{color:#555}
#header{background:#1a1a22;border-bottom:2px solid #2a2a36;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
#header-title{font-size:17px;font-weight:700;letter-spacing:1px}
#header-sub{font-size:10px;letter-spacing:3px;color:#888;margin-bottom:3px}
#badges{display:flex;gap:8px}
.badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.badge-red{background:#3d1a1a;color:#ef4444}
.badge-yellow{background:#3a2f00;color:#eab308}
#tabs{display:flex;background:#15151c;border-bottom:1px solid #2a2a36;position:sticky;top:67px;z-index:99}
.tab{flex:1;padding:12px;border:none;border-bottom:2px solid transparent;background:transparent;color:#666;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:1px}
.tab.active{background:#1e1e2e;color:#a78bfa;border-bottom-color:#a78bfa}
#main{max-width:700px;margin:0 auto;padding:20px 14px 60px}
#meta-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#1a1a22;border-radius:10px;padding:14px;border:1px solid #2a2a36;margin-bottom:16px}
.meta-label{font-size:10px;color:#888;letter-spacing:2px;display:block;margin-bottom:6px}
.field{width:100%;background:#0f0f13;border:1px solid #3a3a50;color:#f0ede8;padding:8px 10px;border-radius:7px;font-size:14px}
select.field option{background:#1a1a22}
#search{width:100%;background:#1a1a22;border:1px solid #2a2a36;color:#f0ede8;padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:14px}
.cat-block{margin-bottom:14px;background:#1a1a22;border-radius:10px;border:1px solid #2a2a36;overflow:hidden}
.cat-header{padding:10px 14px;background:#1e1e2e;display:flex;align-items:center;justify-content:space-between}
.cat-name{font-size:11px;font-weight:700;letter-spacing:3px;color:#a78bfa}
.cat-btns{display:flex;gap:6px}
.btn-add-item{background:#2a2a40;border:none;color:#a78bfa;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:700}
.btn-del-cat{background:#3d1a1a;border:none;color:#ef4444;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:13px}
.item-name{font-size:13px;color:#ccc;word-break:break-word}
.qty-input{width:62px;background:#0f0f13;border:1px solid #333;color:#f0ede8;padding:5px 4px;border-radius:5px;font-size:13px;text-align:center}
.qty-merma{width:48px;background:#1a0a0a;border:1px solid #5a2020;color:#ef4444;padding:5px 4px;border-radius:5px;font-size:13px;text-align:center}
.qty-merma::placeholder{color:#6b2020}
.merma-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.merma-label{font-size:8px;color:#ef4444;letter-spacing:1px;font-weight:700;opacity:.7}
.status-btns{display:flex;gap:3px}
.status-btn{width:26px;height:26px;border-radius:5px;border:none;cursor:pointer;font-size:13px;background:#0f0f13}
.status-btn.active-verde{background:#22c55e33;outline:2px solid #22c55e}
.status-btn.active-amarillo{background:#eab30833;outline:2px solid #eab308}
.status-btn.active-rojo{background:#ef444433;outline:2px solid #ef4444}
.btn-pedir{background:#1e1e2e;color:#555;border:none;border-radius:5px;padding:4px 6px;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.btn-pedir.active{background:#7c3aed;color:#fff}
.btn-del-item{background:none;border:none;color:#555;font-size:15px;cursor:pointer;padding:0 2px}
.btn-pin-cat{background:transparent;border:none;cursor:pointer;font-size:14px;padding:2px 4px;opacity:.45}
.btn-pin-cat.pinned{opacity:1}
.btn-pin-item{background:none;border:none;color:#555;font-size:13px;cursor:pointer;padding:0 2px;opacity:.4}
.btn-pin-item.pinned{color:#f59e0b;opacity:1}
.cat-block.pinned-cat>.cat-header{border-left:3px solid #f59e0b}
.item-row{display:grid;gap:5px;align-items:center;padding:7px 12px;border-bottom:1px solid #1e1e2e}
.cat-empty{padding:12px 16px;color:#444;font-size:12px;text-align:center}
#btn-new-cat{width:100%;padding:11px;border-radius:9px;border:1px dashed #3a3a50;background:transparent;color:#666;cursor:pointer;font-size:13px;font-weight:700;margin-bottom:12px;letter-spacing:1px}
#btn-generar{width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;cursor:pointer;font-size:15px;font-weight:700;letter-spacing:2px;margin-bottom:20px;box-shadow:0 4px 20px #7c3aed55}
#btn-limpiar{width:100%;padding:11px;border-radius:9px;border:1px solid #2a3a2a;background:transparent;color:#4ade80;cursor:pointer;font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:1px}
#result-btns{display:flex;gap:10px;margin-bottom:14px}
.result-btn{flex:1;padding:12px;border-radius:8px;background:#1e1e2e;border:1px solid #333;color:#888;cursor:pointer;font-size:13px;font-weight:700}
#btn-copiar{color:#a78bfa;border-color:#a78bfa44}
#result-pre{background:#1a1a22;border:1px solid #2a2a36;border-radius:10px;padding:18px;font-size:13px;line-height:1.8;white-space:pre-wrap;color:#f0ede8;overflow-x:auto}
#result-empty{text-align:center;color:#555;padding:60px 20px;font-size:14px;line-height:2}
#modal-overlay{display:none;position:fixed;inset:0;background:#000000bb;z-index:1000;align-items:center;justify-content:center;padding:16px}
#modal-overlay.show{display:flex}
.modal-box{background:#1a1a22;border:1px solid #3a3a50;border-radius:12px;padding:22px;width:100%;max-width:400px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-weight:700;font-size:14px;color:#a78bfa;letter-spacing:1px}
.modal-close{background:none;border:none;color:#666;font-size:18px;cursor:pointer}
.modal-input{width:100%;background:#0f0f13;border:1px solid #3a3a50;color:#f0ede8;padding:9px 12px;border-radius:7px;font-size:14px;margin-bottom:12px}
.btn-primary{width:100%;padding:10px;border-radius:7px;border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;cursor:pointer;font-size:13px;font-weight:700}
.modal-body-text{color:#ccc;font-size:13px;margin-bottom:20px;line-height:1.6}
.modal-body-text strong{color:#f0ede8}
.modal-action-btns{display:flex;gap:10px}
.btn-cancel{flex:1;padding:10px;border-radius:7px;border:1px solid #333;background:#1e1e2e;color:#888;cursor:pointer;font-size:13px}
.btn-danger{flex:1;padding:10px;border-radius:7px;border:none;background:#7f1d1d;color:#fca5a5;cursor:pointer;font-size:13px;font-weight:700}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#7c3aed;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;z-index:2000;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="header">
  <div><div id="header-sub">SISTEMA DE INVENTARIO</div><div id="header-title">📋 Control de Stock</div></div>
  <div id="badges"><span class="badge badge-red" id="badge-red">🔴 0</span><span class="badge badge-yellow" id="badge-yellow">🟡 0</span></div>
</div>
<div id="tabs">
  <button class="tab active" id="tab-form" onclick="switchTab('form')">📝 Ingresar</button>
  <button class="tab" id="tab-resultado" onclick="switchTab('resultado')">📄 Resultado</button>
</div>
<div id="main">
  <div id="view-form">
    <div id="meta-box">
      <div><label class="meta-label">FECHA</label><input type="text" id="fecha" class="field"/></div>
      <div><label class="meta-label">TURNO</label>
        <select id="turno" class="field"><option>Mañana</option><option selected>Tarde</option><option>Noche</option></select></div>
    </div>
    <input type="search" id="search" placeholder="🔍 Buscar producto..." oninput="renderCats()" autocomplete="off"/>
    <button id="btn-toggle-merma" onclick="toggleMerma()" style="width:100%;padding:8px;border-radius:8px;border:1px solid #2a2a36;background:#1a1a22;color:#555;cursor:pointer;font-size:12px;font-weight:700;margin-bottom:14px;letter-spacing:1px;">⚠️ MOSTRAR MERMA</button>
    <div id="cats-container"></div>
    <button id="btn-new-cat" onclick="openModalNewCat()">＋ NUEVA CATEGORÍA</button>
    <button id="btn-limpiar" onclick="confirmarLimpiar()">🔄 NUEVO TURNO</button>
    <button id="btn-generar" onclick="generar()">✅ GENERAR INVENTARIO</button>
  </div>
  <div id="view-resultado" style="display:none;">
    <div id="result-btns">
      <button class="result-btn" id="btn-copiar" onclick="copiar()">📋 Copiar texto</button>
      <button class="result-btn" onclick="switchTab('form')">✏️ Editar</button>
    </div>
    <pre id="result-pre" style="display:none;"></pre>
    <div id="result-empty">Primero ingresa el inventario y presiona<br/><strong style="color:#a78bfa">GENERAR INVENTARIO</strong></div>
  </div>
</div>
<div id="modal-overlay" onclick="closeModalIfOverlay(event)"><div class="modal-box" id="modal-box"></div></div>
<div id="toast">✅ Copiado</div>

<script>
function guardar(){
  try{
    localStorage.setItem('inv_categorias',JSON.stringify(categorias));
    localStorage.setItem('inv_datos',JSON.stringify(datos));
    localStorage.setItem('inv_fecha',document.getElementById('fecha').value);
    localStorage.setItem('inv_turno',document.getElementById('turno').value);
    localStorage.setItem('inv_pinnedCats',JSON.stringify([...pinnedCats]));
    localStorage.setItem('inv_pinnedItems',JSON.stringify([...pinnedItems]));
  }catch(e){}
}
function cargar(){
  try{
    const c=localStorage.getItem('inv_categorias'),d=localStorage.getItem('inv_datos'),f=localStorage.getItem('inv_fecha'),t=localStorage.getItem('inv_turno'),pc=localStorage.getItem('inv_pinnedCats'),pi=localStorage.getItem('inv_pinnedItems');
    if(c)categorias=JSON.parse(c);
    if(d)datos=JSON.parse(d);
    if(f)document.getElementById('fecha').value=f;
    if(t)document.getElementById('turno').value=t;
    if(pc)pinnedCats=new Set(JSON.parse(pc));
    if(pi)pinnedItems=new Set(JSON.parse(pi));
    return !!(c||d);
  }catch(e){return false;}
}
let categorias=[
 {nombre:"Postres",items:["Tiramisu","Muffin","Chesscake","Flan Napolitano"]},
 {nombre:"Refrescos",items:["Agua Bonafon","Agua Mineral","Mineral en lata","Squirt","Coca","Sidral","Sprite","Fanta","Fresada","Naranjada","Limonada","Clementina","Arancita","Limon menta","Melograno","Mora glitter","Strongbow","Amaretto","Jarabe endulzante"]},
 {nombre:"Leches",items:["Deslactosada","Entera","Coco","Almendra"]},
 {nombre:"Cerveza",items:["Xx 1/2","Indio 1/2","Indio L","Xx L","Amster","Pacifico","Heineken","Heineken cero","Bohemia obscura","Tecate original","Noche Buena","Modelo negra","Modelo especial","Clamato"]},
 {nombre:"Frutas",items:["Melon","Sandia","Naranjas","Fresas","Cerezas","Limones","Platanos"]},
 {nombre:"Chocolate",items:["Chocolate negro","Chocolate blanco"]},
 {nombre:"Botella de alcohol",items:["Vino tinto","Vino en botella","Vino blanco","Sisi","Malibu","Amaretto (botella)","Rompope","Baileys","Vodka","Kalua","Bacardi","Black and white","Torres","Capitan morgan","Salsa negra micheladas"]},
 {nombre:"Extras",items:["Hershey's chocolate jarabe","Café","Crema batida","Azúcar","Azúcar mascabada","Matcha","Taro","Granola","Nutella","Te verde sobre","Te negro","Te chai","Te chai vainilla","Tisana frutal","Tisana frutal cherry banana","Miel","Mazapanes","Oreo","Azúcar mascabada sobre","Azúcar sobre","Stevia","Caja Te","Sazonador pimienta limón","Desechable vaso y tapas frape","Vasos para cafe","Mermelada fresa","Mermelada zarzamora","Chisperos cumpleaños","Garrafones de agua"]}
];
let datos={},pinnedCats=new Set(),pinnedItems=new Set(),mermaVisible=false;
function key(c,i){return c+'__'+i;}
function initDatos(){categorias.forEach(c=>c.items.forEach(i=>{if(!datos[key(c.nombre,i)])datos[key(c.nombre,i)]={cantidad:'',merma:'',status:'verde',pedir:false};}));}
function hoy(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;}
document.getElementById('fecha').value=hoy();
document.getElementById('fecha').addEventListener('input',guardar);
document.getElementById('turno').addEventListener('change',guardar);

// esc: para usar dentro de onclick='...' ; h: para texto/atributos HTML
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

function renderCats(){
  flushInputs();
  const q=document.getElementById('search').value.toLowerCase();
  const cont=document.getElementById('cats-container');
  cont.innerHTML='';
  categorias.forEach(cat=>{
    const filtered=q?cat.items.filter(i=>i.toLowerCase().includes(q)):cat.items;
    if(q&&filtered.length===0)return;
    const block=document.createElement('div');
    block.className='cat-block'+(pinnedCats.has(cat.nombre)?' pinned-cat':'');
    const hdr=document.createElement('div');
    hdr.className='cat-header';
    const pc=pinnedCats.has(cat.nombre);
    hdr.innerHTML=`<span class="cat-name">${h(cat.nombre.toUpperCase())}</span>
      <div class="cat-btns">
        <button class="btn-pin-cat ${pc?'pinned':''}" onclick="togglePinCat('${esc(cat.nombre)}')">📌</button>
        <button class="btn-add-item" onclick="openModalAddItem('${esc(cat.nombre)}')">+ Agregar</button>
        <button class="btn-del-cat" onclick="confirmDeleteCat('${esc(cat.nombre)}')">🗑</button>
      </div>`;
    block.appendChild(hdr);
    if(filtered.length===0){
      const e=document.createElement('div');e.className='cat-empty';
      e.innerHTML='Sin productos — presiona <strong style="color:#a78bfa">+ Agregar</strong>';
      block.appendChild(e);
    }else{
      filtered.forEach(item=>{
        const k=key(cat.nombre,item);
        const d=datos[k]||{cantidad:'',merma:'',status:'verde',pedir:false};
        const row=document.createElement('div');
        row.className='item-row';row.id='row_'+k;
        const ip=pinnedItems.has(k);
        const C=esc(cat.nombre),I=esc(item);
        const mermaCol=mermaVisible?`<div class="merma-wrap"><span class="merma-label">MERMA</span>
          <input type="text" class="qty-merma" placeholder="0" value="${h(d.merma||'')}" data-merma-key="${h(k)}"
          oninput="setField('${C}','${I}','merma',this.value)" inputmode="numeric"/></div>`:'<span></span>';
        row.style.gridTemplateColumns=mermaVisible?'1fr 62px 48px auto auto auto auto':'1fr 62px auto auto auto auto';
        row.innerHTML=`<span class="item-name">${h(item)}</span>
          <input type="text" class="qty-input" placeholder="Cant." value="${h(d.cantidad)}" data-key="${h(k)}"
            oninput="setField('${C}','${I}','cantidad',this.value)"/>
          ${mermaCol}
          <div class="status-btns">
            <button class="status-btn ${d.status==='verde'?'active-verde':''}" onclick="setStatus('${C}','${I}','verde')">🟢</button>
            <button class="status-btn ${d.status==='amarillo'?'active-amarillo':''}" onclick="setStatus('${C}','${I}','amarillo')">🟡</button>
            <button class="status-btn ${d.status==='rojo'?'active-rojo':''}" onclick="setStatus('${C}','${I}','rojo')">🔴</button>
          </div>
          <button class="btn-pedir ${d.pedir?'active':''}" onclick="togglePedir('${C}','${I}')">PEDIR</button>
          <button class="btn-pin-item ${ip?'pinned':''}" onclick="togglePinItem('${C}','${I}')">📌</button>
          <button class="btn-del-item" onclick="confirmDeleteItem('${C}','${I}')">✕</button>`;
        block.appendChild(row);
      });
    }
    cont.appendChild(block);
  });
  updateBadges();
}
function updateBadges(){
  const v=Object.values(datos);
  document.getElementById('badge-red').textContent='🔴 '+v.filter(d=>d.status==='rojo').length;
  document.getElementById('badge-yellow').textContent='🟡 '+v.filter(d=>d.status==='amarillo').length;
}
function flushInputs(){
  document.querySelectorAll('.qty-input').forEach(i=>{const k=i.dataset.key;if(k&&datos[k]!==undefined)datos[k].cantidad=i.value;});
  document.querySelectorAll('.qty-merma').forEach(i=>{const k=i.dataset.mermaKey;if(k&&datos[k]!==undefined)datos[k].merma=i.value;});
}
function ensure(k){if(!datos[k])datos[k]={cantidad:'',merma:'',status:'verde',pedir:false};}
function setField(c,i,campo,v){const k=key(c,i);ensure(k);datos[k][campo]=v;updateBadges();guardar();}
function setStatus(c,i,status){
  flushInputs();const k=key(c,i);ensure(k);datos[k].status=status;guardar();
  const row=document.getElementById('row_'+k);
  if(row)row.querySelectorAll('.status-btn').forEach(b=>{
    b.className='status-btn';
    if(b.textContent==='🟢'&&status==='verde')b.classList.add('active-verde');
    if(b.textContent==='🟡'&&status==='amarillo')b.classList.add('active-amarillo');
    if(b.textContent==='🔴'&&status==='rojo')b.classList.add('active-rojo');
  });
  updateBadges();
}
function togglePedir(c,i){
  flushInputs();const k=key(c,i);ensure(k);datos[k].pedir=!datos[k].pedir;guardar();
  const row=document.getElementById('row_'+k);
  if(row){const b=row.querySelector('.btn-pedir');if(b)b.className='btn-pedir'+(datos[k].pedir?' active':'');}
}

// ─── GENERAR ───
function generar(){
  flushInputs();
  const fecha=document.getElementById('fecha').value,turno=document.getElementById('turno').value;
  let out=`Inventario – ${fecha} – Turno ${turno}\n\n`;
  out+=`🔴 ROJO — REPOSICIÓN\n🟡 AMARILLO — BAJO / VIGILAR\n🟢 VERDE — STOCK ÓPTIMO\n\n`;
  const EM={verde:'🟢',amarillo:'🟡',rojo:'🔴'};
  const merma=[],rojos=[],amarillos=[],pedidos=[];
  categorias.forEach(cat=>{
    const lineas=cat.items.map(item=>{
      const d=datos[key(cat.nombre,item)];
      if(!d)return null;
      const cant=d.cantidad!==''?d.cantidad:'s/d';
      const linea=`- ${item} (${cat.nombre}): ${cant}`;
      if(d.status==='rojo')rojos.push(linea+(d.pedir?' → PEDIR':''));
      if(d.status==='amarillo')amarillos.push(linea+(d.pedir?' → PEDIR':''));
      if(d.pedir)pedidos.push(linea+' '+EM[d.status]);
      if(d.cantidad==='')return null;
      const hasM=d.merma&&d.merma!=='0';
      if(hasM)merma.push(`- ${item} (${cat.nombre}): ${d.merma}`);
      return `- ${item}-${d.cantidad}${EM[d.status]}${hasM?` ⚠️merma:${d.merma}`:''}${d.pedir?' PEDIR':''}`;
    }).filter(Boolean);
    if(lineas.length)out+=`${cat.nombre}\n\n${lineas.join('\n')}\n\n`;
  });
  out+=`═════════════════════\n📌 RESUMEN DE ALERTAS\n\n`;
  out+=`🔴 ROJO — REPOSICIÓN (${rojos.length})\n`+(rojos.length?rojos.join('\n')+'\n\n':'- Ninguno\n\n');
  out+=`🟡 AMARILLO — BAJO / VIGILAR (${amarillos.length})\n`+(amarillos.length?amarillos.join('\n')+'\n\n':'- Ninguno\n\n');
  out+=`🛒 PARA PEDIR (${pedidos.length})\n`+(pedidos.length?pedidos.join('\n')+'\n\n':'- Nada marcado\n\n');
  if(merma.length)out+=`─────────────────────\n⚠️ RESUMEN DE MERMA\n\n${merma.join('\n')}\n`;
  const pre=document.getElementById('result-pre');
  pre.textContent=out.trim();pre.style.display='block';
  document.getElementById('result-empty').style.display='none';
  switchTab('resultado');
}
function copiar(){
  const t=document.getElementById('result-pre').textContent;if(!t)return;
  const ok=()=>showToast('✅ Copiado al portapapeles');
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
  function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(e){}a.remove();}
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function switchTab(tab){
  document.getElementById('view-form').style.display=tab==='form'?'':'none';
  document.getElementById('view-resultado').style.display=tab==='resultado'?'':'none';
  document.getElementById('tab-form').classList.toggle('active',tab==='form');
  document.getElementById('tab-resultado').classList.toggle('active',tab==='resultado');
}
function openModal(html,onShow){document.getElementById('modal-box').innerHTML=html;document.getElementById('modal-overlay').classList.add('show');if(onShow)onShow();}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show');}
function closeModalIfOverlay(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}
function openModalAddItem(c){
  openModal(`<div class="modal-header"><span class="modal-title">＋ Agregar a ${h(c)}</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <input class="modal-input" id="modal-new-item" placeholder="Nombre del producto" autocomplete="off" onkeydown="if(event.key==='Enter')doAddItem('${esc(c)}')"/>
  <button class="btn-primary" onclick="doAddItem('${esc(c)}')">Agregar</button>`,()=>setTimeout(()=>{const e=document.getElementById('modal-new-item');if(e)e.focus();},100));
}
function doAddItem(c){
  const n=(document.getElementById('modal-new-item')||{value:''}).value.trim();if(!n)return;
  const cat=categorias.find(x=>x.nombre===c);if(cat)cat.items.push(n);
  datos[key(c,n)]={cantidad:'',merma:'',status:'verde',pedir:false};
  closeModal();guardar();renderCats();
}
function openModalNewCat(){
  openModal(`<div class="modal-header"><span class="modal-title">＋ Nueva categoría</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <input class="modal-input" id="modal-new-cat" placeholder="Nombre de la categoría" autocomplete="off" onkeydown="if(event.key==='Enter')doAddCat()"/>
  <button class="btn-primary" onclick="doAddCat()">Crear categoría</button>`,()=>setTimeout(()=>{const e=document.getElementById('modal-new-cat');if(e)e.focus();},100));
}
function doAddCat(){
  const n=(document.getElementById('modal-new-cat')||{value:''}).value.trim();
  if(!n||categorias.find(c=>c.nombre===n))return;
  categorias.push({nombre:n,items:[]});closeModal();guardar();renderCats();
}
function confirmDeleteItem(c,i){
  openModal(`<div class="modal-header"><span class="modal-title">Confirmar eliminación</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <p class="modal-body-text">¿Eliminar <strong>${h(i)}</strong> de ${h(c)}?</p>
  <div class="modal-action-btns"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-danger" onclick="doDeleteItem('${esc(c)}','${esc(i)}')">Sí, eliminar</button></div>`);
}
function doDeleteItem(c,i){
  const cat=categorias.find(x=>x.nombre===c);if(cat)cat.items=cat.items.filter(x=>x!==i);
  delete datos[key(c,i)];closeModal();guardar();renderCats();
}
function confirmDeleteCat(c){
  openModal(`<div class="modal-header"><span class="modal-title">Confirmar eliminación</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <p class="modal-body-text">¿Eliminar la categoría <strong>${h(c)}</strong> y todos sus productos?</p>
  <div class="modal-action-btns"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-danger" onclick="doDeleteCat('${esc(c)}')">Sí, eliminar</button></div>`);
}
function doDeleteCat(c){
  const cat=categorias.find(x=>x.nombre===c);if(cat)cat.items.forEach(i=>delete datos[key(c,i)]);
  categorias=categorias.filter(x=>x.nombre!==c);closeModal();guardar();renderCats();
}
function toggleMerma(){
  mermaVisible=!mermaVisible;
  const b=document.getElementById('btn-toggle-merma');
  if(mermaVisible){b.textContent='⚠️ OCULTAR MERMA';b.style.color='#ef4444';b.style.borderColor='#5a2020';b.style.background='#1a0a0a';}
  else{b.textContent='⚠️ MOSTRAR MERMA';b.style.color='#555';b.style.borderColor='#2a2a36';b.style.background='#1a1a22';}
  renderCats();
}
function togglePinCat(c){pinnedCats.has(c)?pinnedCats.delete(c):pinnedCats.add(c);guardar();renderCats();}
function togglePinItem(c,i){const k=key(c,i);pinnedItems.has(k)?pinnedItems.delete(k):pinnedItems.add(k);guardar();renderCats();}
function confirmarLimpiar(){
  openModal(`<div class="modal-header"><span class="modal-title">🔄 Nuevo turno</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <p class="modal-body-text">Esto borra todas las cantidades y semáforos para empezar un turno nuevo.<br/><br/>Los productos y categorías se mantienen.<br/><br/><strong style="color:#f59e0b">📌 Las categorías y productos fijados conservarán sus datos.</strong></p>
  <div class="modal-action-btns"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-danger" style="background:#14532d;color:#86efac;" onclick="doLimpiar()">Sí, nuevo turno</button></div>`);
}
function doLimpiar(){
  document.querySelectorAll('.qty-input,.qty-merma').forEach(i=>{
    const k=i.dataset.key||i.dataset.mermaKey;if(!k)return;
    if(!pinnedItems.has(k)&&!pinnedCats.has(k.split('__')[0]))i.value='';
  });
  Object.keys(datos).forEach(k=>{
    if(!pinnedItems.has(k)&&!pinnedCats.has(k.split('__')[0]))datos[k]={cantidad:'',merma:'',status:'verde',pedir:false};
  });
  document.getElementById('fecha').value=hoy();
  closeModal();guardar();renderCats();
  const n=pinnedCats.size+pinnedItems.size;
  showToast(n>0?`🔄 Turno limpio — ${n} fijados conservados`:'🔄 Turno limpio — listo para ingresar');
}
(function(){const t=cargar();initDatos();if(t)setTimeout(()=>showToast('💾 Datos del último turno cargados'),300);})();
renderCats();
</script>
</body>
</html>
